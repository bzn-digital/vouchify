name: NuGet Dependency Update

on:
  schedule:
    - cron: "0 6 * * 1" # toda segunda-feira às 06:00 UTC
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  check-updates:
    name: Verifica atualizações de pacotes NuGet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Lista pacotes desatualizados
        id: outdated
        run: |
          PACKAGES=$(dotnet list package --outdated --include-prerelease 2>/dev/null || true)

          if echo "$PACKAGES" | grep -q "No outdated packages"; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Nenhum pacote desatualizado encontrado"
            exit 0
          fi

          echo "has_updates=true" >> $GITHUB_OUTPUT
          echo "$PACKAGES"

          # Extrai lista de pacotes para o corpo do PR
          echo "outdated<<EOF" >> $GITHUB_OUTPUT
          echo "$PACKAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Atualiza pacotes NuGet
        if: steps.outdated.outputs.has_updates == 'true'
        id: update
        run: |
          # Busca todos os .csproj e Directory.Build.props
          PROJECTS=$(find . -name "*.csproj" -o -name "Directory.Build.props" 2>/dev/null)

          if [ -z "$PROJECTS" ]; then
            echo "Nenhum projeto .csproj ou Directory.Build.props encontrado"
            echo "has_projects=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_projects=true" >> $GITHUB_OUTPUT

          UPDATED=""
          for proj in $PROJECTS; do
            echo "Processando: $proj"
            OUTPUT=$(dotnet add "$proj" package --dry-run 2>/dev/null || true)

            # Tenta atualizar cada pacote referenciado no projeto
            PACKAGE_NAMES=$(grep -oP 'PackageReference Include="[^"]+' "$proj" | sed 's/PackageReference Include="//g' || true)

            for pkg in $PACKAGE_NAMES; do
              echo "Verificando atualização para: $pkg"
              RESULT=$(dotnet add "$proj" package "$pkg" 2>&1 || true)

              if echo "$RESULT" | grep -q "added"; then
                UPDATED="$UPDATED\n- \`$pkg\` em \`$proj\`"
              fi
            done
          done

          if [ -z "$UPDATED" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "updated<<EOF" >> $GITHUB_OUTPUT
            echo -e "$UPDATED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Gera data para branch
        if: steps.update.outputs.has_updates == 'true'
        id: meta
        run: |
          DATE=$(date +%Y%m%d)
          echo "branch=feature/update-nuget-$DATE" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Cria branch e commit
        if: steps.update.outputs.has_updates == 'true'
        run: |
          BRANCH="${{ steps.meta.outputs.branch }}"
          git checkout -b "$BRANCH"

          # Restaura para atualizar o lock se existir
          dotnet restore 2>/dev/null || true

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualiza pacotes NuGet desatualizados"

          git push -u origin "$BRANCH"

      - name: Atualiza CHANGELOG.md
        if: steps.update.outputs.has_updates == 'true'
        run: |
          BRANCH="${{ steps.meta.outputs.branch }}"
          git checkout "$BRANCH"

          # Adiciona entrada no changelog
          sed -i '/## \[Unreleased\]/a\\n### Changed\n\n- Atualização de pacotes NuGet desatualizados' CHANGELOG.md

          git add CHANGELOG.md
          git commit -m "docs: atualiza CHANGELOG com pacotes NuGet atualizados"
          git push

      - name: Abre Pull Request
        if: steps.update.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.meta.outputs.branch }}';
            const updated = `${{ steps.update.outputs.updated }}`;
            const outdated = `${{ steps.outdated.outputs.outdated }}`;

            const body = `## 🎯 Tipo

            - [x] Feature (atualização de dependências)

            ## 📋 Descrição

            Atualização automática de pacotes NuGet desatualizados.

            ## 🔧 Pacotes Atualizados

            ${updated}

            ## 📊 Pacotes Verificados

            <details>
            <summary>Resultado completo do dotnet list --outdated</summary>

            \`\`\`
            ${outdated}
            \`\`\`
            </details>

            ## 📝 Checklist

            - [x] Segue o padrão Conventional Commits
            - [x] CHANGELOG.md atualizado
            - [x] Branch derivada de \`develop\`

            ---

            *Este PR foi criado automaticamente pela action de NuGet Dependency Update.*`;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'chore: atualiza pacotes NuGet desatualizados',
              head: branch,
              base: 'develop',
              body: body
            });

            // Adiciona label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['feature', 'dependencies']
            });

            console.log(`PR criado: #${pr.number}`);
