name: PR Auto-Label

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  auto-label:
    name: Auto-Label do PR
    runs-on: ubuntu-latest
    steps:
      - name: Determina label pela branch
        id: label
        run: |
          BRANCH="${{ github.head_ref }}"
          LABEL=""

          if [[ "$BRANCH" == feature/* ]]; then LABEL="feature"; fi
          if [[ "$BRANCH" == bugfix/* ]];  then LABEL="bug"; fi
          if [[ "$BRANCH" == hotfix/* ]];  then LABEL="fix"; fi
          if [[ "$BRANCH" == release/* ]]; then LABEL="release"; fi

          if [ -z "$LABEL" ]; then
            echo "Nenhum label correspondente para a branch $BRANCH"
            echo "has_label=false" >> $GITHUB_OUTPUT
          else
            echo "label=$LABEL" >> $GITHUB_OUTPUT
            echo "has_label=true" >> $GITHUB_OUTPUT
          fi

      - name: Cria labels se não existem
        if: steps.label.outputs.has_label == 'true'
        run: |
          LABELS='[
            {"name":"feature","color":"0E8A16","description":"Nova funcionalidade"},
            {"name":"bug","color":"D93F0B","description":"Correção de bug"},
            {"name":"fix","color":"B60205","description":"Hotfix em produção"},
            {"name":"release","color":"5319E7","description":"Preparação de release"}
          ]'

          for row in $(echo "$LABELS" | jq -c '.[]'); do
            NAME=$(echo "$row" | jq -r '.name')
            COLOR=$(echo "$row" | jq -r '.color')
            DESC=$(echo "$row" | jq -r '.description')

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/labels/$NAME")

            if [ "$STATUS" != "200" ]; then
              curl -s -X POST \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/labels" \
                -d "{\"name\":\"$NAME\",\"color\":\"$COLOR\",\"description\":\"$DESC\"}"
              echo "Label '$NAME' criada"
            else
              echo "Label '$NAME' já existe"
            fi
          done

      - name: Aplica label ao PR
        if: steps.label.outputs.has_label == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const label = '${{ steps.label.outputs.label }}';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label]
            });
