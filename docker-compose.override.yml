version: "3.9"

services:
  vouchify:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: vouchify-dev
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - .:/src
    working_dir: /src
    command: ["dotnet", "watch", "run", "--urls", "http://+:8080"]
